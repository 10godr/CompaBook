name: Despliegue

# Vercel (plan Hobby) bloquea los despliegues desde Git de commits que no son del dueño
# del proyecto. Se despliega con la CLI usando el token del dueño, así que
# desde su punto de vista el despliegue siempre es suyo.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ github.event_name == 'push' && 'production' || 'preview' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Instalar uv (lo usa el constructor de Python de Vercel)
        run: python -m pip install uv

      - name: Instalar la CLI de Vercel
        run: npm install --global vercel@63.1.2

      - name: Traer la configuración del proyecto
        run: vercel pull --yes --environment=$VERCEL_ENV

      - name: Construir
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then vercel build --prod; else vercel build; fi

      - name: Desplegar
        id: deploy
        run: |
          if [ "$VERCEL_ENV" = "production" ]; then
            url=$(vercel deploy --prebuilt --prod)
          else
            url=$(vercel deploy --prebuilt)
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comentar la URL en el PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} --edit-last --create-if-none --body "Preview: $DEPLOY_URL"
